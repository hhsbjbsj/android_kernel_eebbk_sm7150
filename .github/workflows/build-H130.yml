name: Build kernel for H130 (S6) with ReSukiSU + SUSFS 2.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - s6-resukisu-susfs230
      - android-11

jobs:
  build:
    name: Build EEBBK S6 (H130) Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setting up SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            cmake libelf-dev libdw-dev device-tree-compiler swig
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-eebbk-s6-${{ github.sha }}
          restore-keys: |
            ccache-eebbk-s6-

      - name: Restore Clang r416183b
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: ~/toolchains/clang-r416183b
          key: clang-r416183b-toolchain

      - name: Setup Clang r416183b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b ~/toolchains/clang-r416183b

      - name: Save Clang r416183b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/toolchains/clang-r416183b
          key: clang-r416183b-toolchain

      - name: Restore GCC 4.9 Toolchain
        id: cache-gcc
        uses: actions/cache/restore@v4
        with:
          path: ~/toolchains/aarch64-linux-android-4.9
          key: gcc-4.9-lineage-19.1-toolchain

      - name: Setup GCC 4.9 Toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 ~/toolchains/aarch64-linux-android-4.9

      - name: Save GCC 4.9 Toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/toolchains/aarch64-linux-android-4.9
          key: gcc-4.9-lineage-19.1-toolchain

      - name: Sync and Adapt ReSukiSU
        run: |
          if [ -f "scripts/sync_resukisu.sh" ]; then
            chmod +x scripts/sync_resukisu.sh
            ./scripts/sync_resukisu.sh
          fi

      - name: Build kernel
        run: |
          set -e
          set -o pipefail
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=ayin
          export ARCH="arm64"
          export SUBARCH="arm64"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export PATH="$HOME/toolchains/clang-r416183b/bin:$HOME/toolchains/aarch64-linux-android-4.9/bin:$PATH"
          export TARGET_PRODUCT=sm6150
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="5G"
          ccache -s

          make -j$(nproc --all) O=out CC="ccache clang" LD=ld.lld vendor/sdmsteppe-perf_defconfig h130.config
          make -j$(nproc --all) O=out CC="ccache clang" DTC=dtc LD=ld.lld Image.gz dtbs 2>&1 | tee kernel.log

          if [ ! -f out/arch/arm64/boot/Image.gz ] && [ -f out/arch/arm64/boot/Image ]; then
              echo "Compressing Image to Image.gz..."
              gzip -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.gz
          fi

          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-eebbk-s6-${{ github.sha }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EEBBK_S6_${{ env.BUILD_TIME }}_kernel.log
          path: kernel.log

      - name: Check kernel output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
              echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
          else
              echo "Kernel output file is empty"
              exit 1
          fi

      - name: Package AnyKernel3 Flashable ZIP
        if: env.CHECK_FILE_IS_OK == 'true'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          
          # Find and copy H130 dtb if available
          H130_DTB=$(find out/arch/arm64/boot/dts/ -name "*h130*.dtb" | head -n 1)
          if [ -n "$H130_DTB" ]; then
              cp "$H130_DTB" AnyKernel3/dtb
          else
              ANY_DTB=$(find out/arch/arm64/boot/dts/ -name "*.dtb" | head -n 1)
              [ -n "$ANY_DTB" ] && cp "$ANY_DTB" AnyKernel3/dtb || true
          fi
          # Also copy dtbo if generated
          find out/arch/arm64/boot/dts/ -name "*h130*.dtbo" -exec cp {} AnyKernel3/dtbo.img \; || true
          
          cd AnyKernel3
          sed -i 's/device\.name1=.*/device.name1=s6/' anykernel.sh
          sed -i 's/device\.name2=.*/device.name2=H130/' anykernel.sh
          sed -i 's/device\.name3=.*/device.name3=P20H130/' anykernel.sh
          sed -i 's/BLOCK=.*/BLOCK=boot/' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto/' anykernel.sh
          sed -i "s/kernel\.string=.*/kernel.string=EEBBK-S6-ReSukiSU-SUSFS-2.3.0/" anykernel.sh
          
          ZIP_NAME="EEBBK-S6-P20H130-ReSukiSU-SUSFS230-${{ env.BUILD_TIME }}.zip"
          zip -r "../$ZIP_NAME" *
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload AnyKernel3 Flashable ZIP
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EEBBK-S6-Flashable-AnyKernel3
          path: ${{ env.ZIP_PATH }}

      - name: Upload raw Image.gz
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Image-gz-4.14
          path: out/arch/arm64/boot/Image.gz

      - name: Upload DTB files
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-4.14
          path: |
            out/arch/arm64/boot/dts/eebbk-qcom/*.dtb
            out/arch/arm64/boot/dts/eebbk-qcom/*.dtbo
            out/arch/arm64/boot/dts/qcom/*.dtb
