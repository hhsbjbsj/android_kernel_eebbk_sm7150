name: Build kernel for H130 (S6) with ReSukiSU + SUSFS 2.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - s6-resukisu-susfs230
      - android-11

jobs:
  build:
    name: Build EEBBK S6 (H130) Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setting up SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl dwarves flex gawk \
            git gnupg gperf imagemagick jq libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            cmake libelf-dev libdw-dev device-tree-compiler swig
          pahole --version
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-eebbk-s6-${{ github.sha }}
          restore-keys: |
            ccache-eebbk-s6-

      - name: Restore Clang r416183b
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: ~/toolchains/clang-r416183b
          key: clang-r416183b-toolchain

      - name: Setup Clang r416183b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b ~/toolchains/clang-r416183b

      - name: Save Clang r416183b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/toolchains/clang-r416183b
          key: clang-r416183b-toolchain

      - name: Restore GCC 4.9 Toolchain
        id: cache-gcc
        uses: actions/cache/restore@v4
        with:
          path: ~/toolchains/aarch64-linux-android-4.9
          key: gcc-4.9-lineage-19.1-toolchain

      - name: Setup GCC 4.9 Toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 ~/toolchains/aarch64-linux-android-4.9

      - name: Save GCC 4.9 Toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/toolchains/aarch64-linux-android-4.9
          key: gcc-4.9-lineage-19.1-toolchain

      - name: Sync and Adapt ReSukiSU
        run: |
          if [ -f "scripts/sync_resukisu.sh" ]; then
            chmod +x scripts/sync_resukisu.sh
            ./scripts/sync_resukisu.sh
          fi

      - name: Build kernel
        run: |
          set -e
          set -o pipefail
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=ayin
          export ARCH="arm64"
          export SUBARCH="arm64"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export PATH="$HOME/toolchains/clang-r416183b/bin:$HOME/toolchains/aarch64-linux-android-4.9/bin:$PATH"
          export TARGET_PRODUCT=sm6150
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="5G"
          ccache -s

          make -j$(nproc --all) O=out CC="ccache clang" LD=ld.lld vendor/sdmsteppe-perf_defconfig h130.config
          make -j$(nproc --all) O=out CC="ccache clang" DTC=dtc LD=ld.lld KSU_EXPECTED_SIZE=0x039a KSU_EXPECTED_HASH="366aa724f4ed84d589fb47077cee4dc6aac45c37c4a50a6e1eaed4446bb3bc03" Image Image.gz dtbs 2>&1 | tee kernel.log

          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-eebbk-s6-${{ github.sha }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EEBBK_S6_${{ env.BUILD_TIME }}_kernel.log
          path: kernel.log

      - name: Check kernel output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
              echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
          else
              echo "Kernel output file is empty"
              exit 1
          fi

      - name: Verify 4.14.357 + ReSukiSU + SUSFS 2.3.0 + BTF + Binder Freeze
        if: env.CHECK_FILE_IS_OK == 'true'
        run: |
          set -Eeuo pipefail
          set -x
          mkdir -p out/artifacts
          READELF_BIN="$HOME/toolchains/clang-r416183b/bin/llvm-readelf"
          NM_BIN="$HOME/toolchains/clang-r416183b/bin/llvm-nm"

          grep -q '^SUBLEVEL = 357$' Makefile
          grep -Fq '4.14.357' out/include/generated/utsrelease.h
          grep -Fq 'LINUX_VERSION_CODE 265983' out/include/generated/uapi/linux/version.h
          grep -Fq 'LINUX_VERSION_SUBLEVEL 357' out/include/generated/uapi/linux/version.h

          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_MULTI_MANAGER_SUPPORT=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          grep -qx 'CONFIG_DEBUG_INFO_BTF=y' out/.config
          grep -qx 'CONFIG_KPROBES=y' out/.config
          grep -qx 'CONFIG_ALWAYS_PERMISSIVE=y' out/.config
          ! grep -q '^CONFIG_KPM=y$' out/.config

          # Verify KERNEL-REQUESTS.md requirements:
          # 1. WiFi icnss legacy mode (no QMI wait)
          grep -qx 'CONFIG_ICNSS=y' out/.config
          ! grep -q '^CONFIG_ICNSS_QMI=y$' out/.config
          grep -qx 'CONFIG_QCA_CLD_WLAN=y' out/.config
          grep -qx 'CONFIG_QCOM_QMI_HELPERS=y' out/.config
          grep -qx 'CONFIG_QRTR=y' out/.config

          # 2. Framebuffer Console (fbcon + DRM fbdev emulation)
          grep -qx 'CONFIG_DRM_FBDEV_EMULATION=y' out/.config
          grep -qx 'CONFIG_DRM_FBDEV_OVERALLOC=100' out/.config
          grep -qx 'CONFIG_FRAMEBUFFER_CONSOLE=y' out/.config
          grep -qx 'CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y' out/.config

          # 3. USB Gadget 3-Channel (ACM + RNDIS + ECM + OBEX + SERIAL)
          grep -qx 'CONFIG_USB_CONFIGFS_ACM=y' out/.config
          grep -qx 'CONFIG_USB_F_ACM=y' out/.config
          grep -qx 'CONFIG_USB_U_SERIAL=y' out/.config
          grep -qx 'CONFIG_USB_CONFIGFS_RNDIS=y' out/.config
          grep -qx 'CONFIG_USB_F_RNDIS=y' out/.config
          grep -qx 'CONFIG_USB_CONFIGFS_ECM=y' out/.config
          grep -qx 'CONFIG_USB_F_ECM=y' out/.config
          grep -qx 'CONFIG_USB_CONFIGFS_ECM_SUBSET=y' out/.config
          grep -qx 'CONFIG_USB_F_SUBSET=y' out/.config
          grep -qx 'CONFIG_USB_CONFIGFS_OBEX=y' out/.config
          grep -qx 'CONFIG_USB_F_OBEX=y' out/.config
          grep -qx 'CONFIG_USB_CONFIGFS_SERIAL=y' out/.config
          grep -qx 'CONFIG_USB_F_SERIAL=y' out/.config

          "$READELF_BIN" -S out/vmlinux > out/artifacts/vmlinux-sections.txt
          "$NM_BIN" out/vmlinux > out/artifacts/vmlinux-nm.txt
          grep -Fq '.BTF' out/artifacts/vmlinux-sections.txt
          grep -Eq '[[:space:]]__start_BTF$' out/artifacts/vmlinux-nm.txt
          grep -Eq '[[:space:]]__stop_BTF$' out/artifacts/vmlinux-nm.txt
          grep -Eq '[[:space:]]btf_vmlinux_init$' out/artifacts/vmlinux-nm.txt
          grep -Eq '[[:space:]]susfs_set_priority_uid_filter$' out/artifacts/vmlinux-nm.txt
          grep -Eq '[[:space:]]susfs_is_priority_uid_filtered$' out/artifacts/vmlinux-nm.txt
          grep -Eq '[[:space:]]ksu_handle_sys_reboot$' out/artifacts/vmlinux-nm.txt
          grep -Eq '[[:space:]]ksu_handle_post_execveat_sucompat$' out/artifacts/vmlinux-nm.txt
          rm -f out/artifacts/vmlinux-sections.txt out/artifacts/vmlinux-nm.txt

          grep -Fq 'BINDER_FREEZE' include/uapi/linux/android/binder.h
          grep -Fq 'BINDER_GET_FROZEN_INFO' include/uapi/linux/android/binder.h
          grep -Fq 'TF_UPDATE_TXN' include/uapi/linux/android/binder.h

          KSU_COMMIT_VAL="$(cat drivers/kernelsu/.resukisu_commit_full 2>/dev/null || echo unknown)"
          KSU_VERNAME_VAL="$(cat drivers/kernelsu/.resukisu_version_full 2>/dev/null || echo unknown)"
          cat > out/artifacts/kernel-version-proof.txt <<EOF
          kernel_version=4.14.357
          sublevel=357
          linux_version_code=265983
          resukisu_commit=${KSU_COMMIT_VAL}
          resukisu_version=${KSU_VERNAME_VAL}
          susfs_version=v2.3.0
          priority_uid_filter=enabled
          embedded_btf=enabled
          kprobes=enabled
          kpm=disabled
          EOF

          export KSU_COMMIT_VAL KSU_VERNAME_VAL
          python3 - <<'PY_MANIFEST'
          import json
          import os
          from pathlib import Path

          manifest = {
              "target_device": "EEBBK S6 / P20H130 (sm7150)",
              "kernel_version": "4.14.357",
              "linux_version_code": 265983,
              "reference_baseline": "android_kernel_oppo_sm6125-resukisu-final@f3b4ee6a48a03a67ece3b6699d3e07b4f278dca8 (Run 152)",
              "bakasu_commit": os.environ.get("KSU_COMMIT_VAL", "unknown"),
              "bakasu_version": os.environ.get("KSU_VERNAME_VAL", "unknown"),
              "susfs_version": "v2.3.0",
              "manager_dual_signatures": ["0x039a", "0x38b"],
              "kpm_status": "disabled",
              "capabilities": {
                  "SUSFS_230_PRIORITY_UID_FILTER": True,
                  "EMBEDDED_VMLINUX_BTF": True,
                  "KPROBES_SCENE_BPF_FIX": True,
                  "CGROUP_V2_FREEZER": True,
                  "BINDER_FREEZE_AND_419_STABILITY": True,
                  "DROIDSPACES_CONTAINER_NETWORKING": True,
                  "SELINUX_BOOT_PERMISSIVE": True,
              },
          }
          Path("out/artifacts/source-final-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY_MANIFEST
          echo "[PASS] Verified Linux 4.14.357 + ReSukiSU + SUSFS 2.3.0 + .BTF + Binder Freeze"

      - name: Build Android DTBO Image
        if: env.CHECK_FILE_IS_OK == 'true'
        run: |
          mkdir -p out/artifacts
          H130_DTBOS=$(find out/arch/arm64/boot/dts/ -name "*h130*.dtbo")
          if [ -n "$H130_DTBOS" ]; then
              python3 scripts/dtc/libfdt/mkdtboimg.py create out/artifacts/dtbo.img --page_size=4096 $H130_DTBOS
              echo "Created out/artifacts/dtbo.img"
          fi

      - name: Package AnyKernel3 Flashable ZIP
        if: env.CHECK_FILE_IS_OK == 'true'
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          git -C AnyKernel3 checkout dca9dc3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md AnyKernel3/LICENSE

          # Clean any existing sample scripts or dtb/dtbo
          rm -rf AnyKernel3/dtb AnyKernel3/dtb.img AnyKernel3/dtbo AnyKernel3/dtbo.img AnyKernel3/Image AnyKernel3/Image.gz* 2>/dev/null || true

          # Copy our dedicated clean anykernel.sh (permissive SELinux, no ramdisk/init.rc tampering)
          cp anykernel/anykernel.sh AnyKernel3/anykernel.sh

          # Copy the freshly built kernel Image.gz
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          
          cd AnyKernel3
          ZIP_NAME="EEBBK-S6-P20H130-4.14.357-ReSukiSU-SUSFS230-BootOnly-${{ env.BUILD_TIME }}.zip"
          zip -r "../$ZIP_NAME" *
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV

      - name: Publish GitHub Release
        if: env.CHECK_FILE_IS_OK == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v4.14.357-s6-resukisu-run${GITHUB_RUN_NUMBER}"
          RELEASE_FILES=("$ZIP_PATH" "out/artifacts/kernel-version-proof.txt" "out/artifacts/source-final-manifest.json")
          if [ -f "out/artifacts/dtbo.img" ]; then
            RELEASE_FILES+=("out/artifacts/dtbo.img")
          fi
          if command -v gh >/dev/null 2>&1; then
            gh release create "$TAG_NAME" "${RELEASE_FILES[@]}" \
              --title "EEBBK S6 (H130) Linux 4.14.357 + ReSukiSU + SUSFS 2.3.0 (Run #${GITHUB_RUN_NUMBER})" \
              --notes "Automated build of EEBBK S6 (P20H130 / SM7150) upgraded to Linux 4.14.357 with ReSukiSU (BakaSU main), SUSFS 2.3.0 (priority_uid_filter), embedded vmlinux BTF, Kprobes, Cgroup v2 Freezer, and Binder Freeze (ported from SM6125 Run #152 baseline)." || true
          fi

      - name: Upload AnyKernel3 Flashable ZIP
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EEBBK-S6-4.14.357-Flashable-AnyKernel3
          path: ${{ env.ZIP_PATH }}

      - name: Upload Proof, Manifest, .config & System.map
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proof-manifest-4.14.357
          include-hidden-files: true
          path: |
            out/artifacts/kernel-version-proof.txt
            out/artifacts/source-final-manifest.json
            out/.config
            out/System.map

      - name: Upload raw Image.gz
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Image-gz-4.14.357
          path: out/arch/arm64/boot/Image.gz

      - name: Upload DTB files
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-4.14.357
          path: |
            out/arch/arm64/boot/dts/eebbk-qcom/*.dtb
            out/arch/arm64/boot/dts/eebbk-qcom/*.dtbo
            out/arch/arm64/boot/dts/qcom/*.dtb

      - name: Upload DTBO Image
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-img-4.14.357
          path: out/artifacts/dtbo.img
