name: Build kernel for H130 (S6) with ReSukiSU + SUSFS 2.3.0

on:
  workflow_dispatch:
  push:
    branches:
      - s6-resukisu-susfs230
      - android-11

jobs:
  build:
    name: Build EEBBK S6 (H130) Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setting up SWAP
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 5

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            cmake libelf-dev libdw-dev device-tree-compiler swig
          echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-eebbk-s6-${{ github.sha }}
          restore-keys: |
            ccache-eebbk-s6-

      - name: Restore Clang r416183b
        id: cache-clang
        uses: actions/cache/restore@v4
        with:
          path: ~/toolchains/clang-r416183b
          key: clang-r416183b-toolchain

      - name: Setup Clang r416183b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b ~/toolchains/clang-r416183b

      - name: Save Clang r416183b
        if: steps.cache-clang.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/toolchains/clang-r416183b
          key: clang-r416183b-toolchain

      - name: Restore GCC 4.9 Toolchain
        id: cache-gcc
        uses: actions/cache/restore@v4
        with:
          path: ~/toolchains/aarch64-linux-android-4.9
          key: gcc-4.9-lineage-19.1-toolchain

      - name: Setup GCC 4.9 Toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/toolchains
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 ~/toolchains/aarch64-linux-android-4.9

      - name: Save GCC 4.9 Toolchain
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/toolchains/aarch64-linux-android-4.9
          key: gcc-4.9-lineage-19.1-toolchain

      - name: Sync and Adapt ReSukiSU
        run: |
          if [ -f "scripts/sync_resukisu.sh" ]; then
            chmod +x scripts/sync_resukisu.sh
            ./scripts/sync_resukisu.sh
          fi

      - name: Build kernel
        run: |
          set -e
          set -o pipefail
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=ayin
          export ARCH="arm64"
          export SUBARCH="arm64"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export PATH="$HOME/toolchains/clang-r416183b/bin:$HOME/toolchains/aarch64-linux-android-4.9/bin:$PATH"
          export TARGET_PRODUCT=sm6150
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="5G"
          ccache -s

          make -j$(nproc --all) O=out CC="ccache clang" LD=ld.lld vendor/sdmsteppe-perf_defconfig h130.config
          make -j$(nproc --all) O=out CC="ccache clang" DTC=dtc LD=ld.lld KSU_EXPECTED_SIZE=0x039a KSU_EXPECTED_HASH="366aa724f4ed84d589fb47077cee4dc6aac45c37c4a50a6e1eaed4446bb3bc03" Image Image.gz dtbs 2>&1 | tee kernel.log

          ccache -s

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-eebbk-s6-${{ github.sha }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EEBBK_S6_${{ env.BUILD_TIME }}_kernel.log
          path: kernel.log

      - name: Check kernel output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
              echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
          else
              echo "Kernel output file is empty"
              exit 1
          fi

      - name: Build Android DTBO Image
        if: env.CHECK_FILE_IS_OK == 'true'
        run: |
          mkdir -p out/artifacts
          H130_DTBOS=$(find out/arch/arm64/boot/dts/ -name "*h130*.dtbo")
          if [ -n "$H130_DTBOS" ]; then
              python3 scripts/dtc/libfdt/mkdtboimg.py create out/artifacts/dtbo.img --page_size=4096 $H130_DTBOS
              echo "Created out/artifacts/dtbo.img"
          fi

      - name: Package AnyKernel3 Flashable ZIP
        if: env.CHECK_FILE_IS_OK == 'true'
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          git -C AnyKernel3 checkout dca9dc3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md AnyKernel3/LICENSE

          # Clean any existing sample scripts or dtb/dtbo
          rm -rf AnyKernel3/dtb AnyKernel3/dtb.img AnyKernel3/dtbo AnyKernel3/dtbo.img AnyKernel3/Image AnyKernel3/Image.gz* 2>/dev/null || true

          # Copy our dedicated clean anykernel.sh (permissive SELinux, no ramdisk/init.rc tampering)
          cp anykernel/anykernel.sh AnyKernel3/anykernel.sh

          # Copy the freshly built kernel Image.gz
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          
          cd AnyKernel3
          ZIP_NAME="EEBBK-S6-P20H130-ReSukiSU-SUSFS230-BootOnly-${{ env.BUILD_TIME }}.zip"
          zip -r "../$ZIP_NAME" *
          echo "ZIP_PATH=$GITHUB_WORKSPACE/$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload AnyKernel3 Flashable ZIP
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EEBBK-S6-Flashable-AnyKernel3
          path: ${{ env.ZIP_PATH }}

      - name: Upload raw Image.gz
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Image-gz-4.14
          path: out/arch/arm64/boot/Image.gz

      - name: Upload DTB files
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-4.14
          path: |
            out/arch/arm64/boot/dts/eebbk-qcom/*.dtb
            out/arch/arm64/boot/dts/eebbk-qcom/*.dtbo
            out/arch/arm64/boot/dts/qcom/*.dtb

      - name: Upload DTBO Image
        if: env.CHECK_FILE_IS_OK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-img-4.14
          path: out/artifacts/dtbo.img
